{% extends "base.html" %}
{% block title %}{{ 'Edit' if disease else 'Add' }} Disease - Admin{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit' if disease else 'Add' }} Disease</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Disease Name</label>
        <input type="text" class="form-control" name="disease_name" value="{{ disease.disease_name if disease else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Crop Type</label>
        <input type="text" class="form-control" name="crop_type" value="{{ disease.crop_type if disease else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="2">{{ disease.description if disease else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Symptoms</label>
        <textarea class="form-control" name="symptoms" rows="2">{{ disease.symptoms if disease else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Causes</label>
        <textarea class="form-control" name="causes" rows="2">{{ disease.causes if disease else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Treatment</label>
        <textarea class="form-control" name="treatment" rows="2">{{ disease.treatment if disease else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Prevention</label>
        <textarea class="form-control" name="prevention" rows="2">{{ disease.prevention if disease else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Severity</label>
        <select class="form-select" name="severity_level" style="max-width:150px">
            <option value="low" {{ 'selected' if disease and disease.severity_level == 'low' else '' }}>Low</option>
            <option value="medium" {{ 'selected' if not disease or disease.severity_level == 'medium' else '' }}>Medium</option>
            <option value="high" {{ 'selected' if disease and disease.severity_level == 'high' else '' }}>High</option>
        </select>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{{ url_for('admin_diseases') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
